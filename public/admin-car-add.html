<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить автомобиль | Drive Premium</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f5f9ff;
            padding: 40px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        .card {
            background: white;
            border-radius: 32px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        h1 { color: #0a2a44; margin-bottom: 30px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: #0a2a44; }
        input, select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 28px;
            border: 1px solid #cbdae9;
            font-size: 1rem;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            border: none;
            text-align: center;
        }
        .btn-primary { background: #0a4b8a; color: white; width: 100%; margin-top: 10px; }
        .btn-outline { background: transparent; border: 2px solid #0a4b8a; color: #0a4b8a; margin-top: 15px; display: block; text-align: center; }
        .error-message { background: #fee2e2; color: #dc2626; padding: 10px; border-radius: 12px; margin-bottom: 20px; display: none; }
        .success-message { background: #dcfce7; color: #16a34a; padding: 10px; border-radius: 12px; margin-bottom: 20px; display: none; }
        .auth-bar {
            background: #0a2a44;
            padding: 10px 24px;
            margin-bottom: 30px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 20px;
            color: white;
            border-radius: 60px;
        }
        .auth-bar a { color: white; text-decoration: none; }
        .auth-bar button {
            background: transparent;
            border: 1px solid white;
            color: white;
            padding: 5px 15px;
            border-radius: 40px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="auth-bar" id="authBar">
            <div id="userInfo" style="display: none;">
                <span id="userName"></span>
                <button id="logoutBtn">Выйти</button>
            </div>
            <div id="guestInfo">
                <a href="login.html">Войти</a>
                <a href="register.html">Регистрация</a>
            </div>
        </div>

        <div class="card">
            <h1>➕ Добавить автомобиль</h1>
            
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>
            
            <form id="addCarForm">
                <div class="form-group">
                    <label>Бренд</label>
                    <input type="text" id="brand" placeholder="Например: BMW" required>
                </div>
                <div class="form-group">
                    <label>Модель</label>
                    <input type="text" id="model" placeholder="Например: X5 xDrive40i" required>
                </div>
                <div class="form-group">
                    <label>Цена (₽)</label>
                    <input type="number" id="price" placeholder="Например: 7990000" required>
                </div>
                <div class="form-group">
                    <label>Год выпуска</label>
                    <input type="number" id="year" placeholder="Например: 2024" required>
                </div>
                <div class="form-group">
                    <label>Тип двигателя</label>
                    <select id="engine_type">
                        <option value="Бензин">Бензин</option>
                        <option value="Дизель">Дизель</option>
                        <option value="Электро">Электро</option>
                        <option value="Гибрид">Гибрид</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">➕ Добавить автомобиль</button>
            </form>
            <a href="admin-cars.html" class="btn btn-outline">← Назад к списку</a>
        </div>
    </div>

    <script>
        async function checkAuth() {
            const response = await fetch('/api/me');
            const data = await response.json();
            if (data.user) {
                document.getElementById('userInfo').style.display = 'flex';
                document.getElementById('guestInfo').style.display = 'none';
                document.getElementById('userName').innerHTML = `${data.user.first_name} ${data.user.last_name}`;
                if (data.user.role !== 'admin') {
                    window.location.href = '/';
                }
            } else {
                window.location.href = '/login.html';
            }
        }

        const form = document.getElementById('addCarForm');
        const errorDiv = document.getElementById('errorMessage');
        const successDiv = document.getElementById('successMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            const carData = {
                brand: document.getElementById('brand').value,
                model: document.getElementById('model').value,
                price: parseInt(document.getElementById('price').value),
                year: parseInt(document.getElementById('year').value),
                engine_type: document.getElementById('engine_type').value
            };

            try {
                const response = await fetch('/api/cars', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(carData)
                });

                if (response.ok) {
                    successDiv.textContent = '✅ Автомобиль успешно добавлен! Перенаправление...';
                    successDiv.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = 'admin-cars.html';
                    }, 1500);
                } else {
                    const error = await response.json();
                    errorDiv.textContent = error.error || 'Ошибка при добавлении';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.textContent = 'Ошибка соединения с сервером';
                errorDiv.style.display = 'block';
            }
        });

        async function logout() {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/';
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) logoutBtn.addEventListener('click', logout);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | Drive Premium</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a2a44 0%, #1060a0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .register-container {
            background: white;
            border-radius: 32px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
        }
        .logo {
            text-align: center;
            margin-bottom: 24px;
        }
        .logo-icon {
            width: 50px;
            height: 50px;
            background: #0a4b8a;
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
        }
        .logo-text {
            font-size: 1.5rem;
            font-weight: 800;
            color: #0a2a44;
            margin-top: 8px;
        }
        .logo-text span {
            color: #0a4b8a;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: #0a2a44;
            text-align: center;
        }
        .subtitle {
            color: #4a627a;
            margin-bottom: 24px;
            text-align: center;
            font-size: 0.9rem;
        }
        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
        .input-group {
            margin-bottom: 15px;
            flex: 1;
        }
        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 28px;
            border: 1px solid #cbdae9;
            font-size: 0.95rem;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            border: none;
        }
        .btn-primary {
            background: #0a4b8a;
            color: white;
        }
        .btn-primary:hover {
            background: #063a66;
        }
        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #4a627a;
            font-size: 0.9rem;
        }
        .login-link a {
            color: #0a4b8a;
            text-decoration: none;
        }
        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            font-size: 0.9rem;
        }
        .success-message {
            background: #dcfce7;
            color: #16a34a;
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            font-size: 0.9rem;
        }
        @media (max-width: 500px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }
            .register-container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="logo">
            <div class="logo-icon"><i class="fas fa-car-side"></i></div>
            <div class="logo-text">Drive<span>Premium</span></div>
        </div>
        <h1>Регистрация</h1>
        <p class="subtitle">Создайте аккаунт, чтобы пользоваться всеми возможностями</p>
        
        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>
        
        <form id="registerForm">
            <div class="form-row">
                <div class="input-group">
                    <input type="text" id="last_name" placeholder="Фамилия" required>
                </div>
                <div class="input-group">
                    <input type="text" id="first_name" placeholder="Имя" required>
                </div>
            </div>
            <div class="input-group">
                <input type="text" id="middle_name" placeholder="Отчество (необязательно)">
            </div>
            <div class="input-group">
                <input type="email" id="email" placeholder="Email" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Пароль" required>
            </div>
            <div class="input-group">
                <input type="password" id="confirm_password" placeholder="Подтвердите пароль" required>
            </div>
            <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
        </form>
        
        <div class="login-link">
            Уже есть аккаунт? <a href="login.html">Войти</a>
        </div>
    </div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script>
        const registerForm = document.getElementById('registerForm');
        const errorDiv = document.getElementById('errorMessage');
        const successDiv = document.getElementById('successMessage');
        
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            
            if (password !== confirmPassword) {
                errorDiv.textContent = 'Пароли не совпадают';
                errorDiv.style.display = 'block';
                return;
            }
            
            if (password.length < 6) {
                errorDiv.textContent = 'Пароль должен содержать не менее 6 символов';
                errorDiv.style.display = 'block';
                return;
            }
            
            const userData = {
                last_name: document.getElementById('last_name').value,
                first_name: document.getElementById('first_name').value,
                middle_name: document.getElementById('middle_name').value || null,
                email: document.getElementById('email').value,
                password: password
            };
            
            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    successDiv.textContent = data.message || 'Регистрация успешна! Перенаправляем на вход...';
                    successDiv.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    errorDiv.textContent = data.error || 'Ошибка при регистрации';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.textContent = 'Ошибка соединения с сервером';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>

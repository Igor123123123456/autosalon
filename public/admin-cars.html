<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление автомобилями | Drive Premium</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f5f9ff;
            padding: 40px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #0a2a44; margin-bottom: 20px; }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 600;
            margin: 5px;
            cursor: pointer;
            border: none;
        }
        .btn-primary { background: #0a4b8a; color: white; }
        .btn-warning { background: #e67e22; color: white; }
        .btn-danger { background: #dc2626; color: white; }
        .btn-success { background: #10b981; color: white; }
        .btn-outline { background: transparent; border: 2px solid #0a4b8a; color: #0a4b8a; }
        .auth-bar {
            background: #0a2a44;
            padding: 10px 24px;
            margin-bottom: 30px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 20px;
            color: white;
            border-radius: 60px;
        }
        .auth-bar a { color: white; text-decoration: none; }
        .auth-bar button {
            background: transparent;
            border: 1px solid white;
            color: white;
            padding: 5px 15px;
            border-radius: 40px;
            cursor: pointer;
        }
        
        /* Блок поиска и фильтров */
        .search-filter-section {
            background: white;
            border-radius: 32px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
        }
        .filter-group {
            flex: 1;
            min-width: 120px;
        }
        .filter-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #0a2a44;
            font-size: 0.8rem;
        }
        .filter-group input, .filter-group select {
            width: 100%;
            padding: 8px 12px;
            border-radius: 40px;
            border: 1px solid #cbdae9;
        }
        .btn-sm {
            padding: 8px 16px;
            font-size: 0.85rem;
        }
        
        table {
            width: 100%;
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e2edfc;
        }
        th { background: #0a4b8a; color: white; }
        .actions button, .actions a { margin: 0 5px; padding: 5px 15px; font-size: 0.85rem; }
        .loading { text-align: center; padding: 50px; }
        .empty { text-align: center; padding: 40px; color: #4a627a; }
    </style>
</head>
<body>
    <div class="container">
        <div class="auth-bar" id="authBar">
            <div id="userInfo" style="display: none;">
                <span id="userName"></span>
                <button id="logoutBtn">Выйти</button>
            </div>
            <div id="guestInfo">
                <a href="login.html">Войти</a>
                <a href="register.html">Регистрация</a>
            </div>
        </div>

        <h1>🚗 Управление автомобилями</h1>
        
        <!-- Блок поиска и фильтров -->
        <div class="search-filter-section">
            <div class="filter-row">
                <div class="filter-group">
                    <label>Поиск</label>
                    <input type="text" id="searchInput" placeholder="Модель, бренд...">
                </div>
                <div class="filter-group">
                    <label>Цена от</label>
                    <input type="number" id="minPrice" placeholder="0">
                </div>
                <div class="filter-group">
                    <label>Цена до</label>
                    <input type="number" id="maxPrice" placeholder="20 000 000">
                </div>
                <div class="filter-group">
                    <label>Бренд</label>
                    <select id="brandFilter">
                        <option value="all">Все бренды</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Двигатель</label>
                    <select id="engineFilter">
                        <option value="all">Все</option>
                        <option value="Бензин">Бензин</option>
                        <option value="Дизель">Дизель</option>
                        <option value="Электро">Электро</option>
                        <option value="Гибрид">Гибрид</option>
                    </select>
                </div>
                <div class="filter-group">
                    <button id="applyFilterBtn" class="btn btn-primary btn-sm">🔍 Применить</button>
                    <button id="resetFilterBtn" class="btn btn-outline btn-sm">Сбросить</button>
                </div>
            </div>
        </div>
        
        <div style="margin-bottom: 20px;">
            <a href="admin-car-add.html" class="btn btn-success">+ Добавить автомобиль</a>
            <a href="admin.html" class="btn btn-outline">← Назад в админ-панель</a>
            <button id="exportAllBtn" class="btn btn-primary" style="background: #10b981;">📊 Экспорт всех авто</button>
            <button id="exportFilteredBtn" class="btn btn-primary" style="background: #e67e22;">🔍 Экспорт отфильтрованных</button>
        </div>

        <div id="carsTable">
            <div class="loading">Загрузка...</div>
        </div>
    </div>

    <script>
        async function checkAuth() {
            const response = await fetch('/api/me');
            const data = await response.json();
            if (data.user && data.user.role === 'admin') {
                document.getElementById('userInfo').style.display = 'flex';
                document.getElementById('guestInfo').style.display = 'none';
                document.getElementById('userName').innerHTML = `${data.user.first_name} ${data.user.last_name}`;
            } else {
                window.location.href = '/login.html';
            }
        }

        let currentFilters = { search: '', minPrice: '', maxPrice: '', brand: 'all', engine: 'all' };

        async function loadBrands() {
            try {
                const response = await fetch('/api/cars/brands');
                if (response.ok) {
                    const brands = await response.json();
                    const brandSelect = document.getElementById('brandFilter');
                    brands.forEach(brand => {
                        const option = document.createElement('option');
                        option.value = brand;
                        option.textContent = brand;
                        brandSelect.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('Ошибка загрузки брендов:', error);
            }
        }

        async function loadCars() {
            const carsDiv = document.getElementById('carsTable');
            carsDiv.innerHTML = '<div class="loading">Загрузка...</div>';
            
            let url = '/api/cars?';
            const params = [];
            if (currentFilters.search) params.push(`search=${encodeURIComponent(currentFilters.search)}`);
            if (currentFilters.minPrice) params.push(`minPrice=${currentFilters.minPrice}`);
            if (currentFilters.maxPrice) params.push(`maxPrice=${currentFilters.maxPrice}`);
            if (currentFilters.brand && currentFilters.brand !== 'all') params.push(`brand=${encodeURIComponent(currentFilters.brand)}`);
            if (currentFilters.engine && currentFilters.engine !== 'all') params.push(`engine_type=${encodeURIComponent(currentFilters.engine)}`);
            url += params.join('&');
            
            try {
                const response = await fetch(url);
                const cars = await response.json();
                
                if (cars.length === 0) {
                    carsDiv.innerHTML = '<div class="empty">🚫 Нет автомобилей. Нажмите "Добавить автомобиль"</div>';
                    return;
                }
                
                let html = '<table><thead><tr><th>ID</th><th>Модель</th><th>Бренд</th><th>Цена (₽)</th><th>Год</th><th>Двигатель</th><th>Действия</th></tr></thead><tbody>';
                cars.forEach(car => {
                    html += `
                        <tr>
                            <td>${car.id}</td>
                            <td>${car.model}</td>
                            <td>${car.brand}</td>
                            <td>${car.price.toLocaleString('ru-RU')}</td>
                            <td>${car.year}</td>
                            <td>${car.engine_type || '—'}</td>
                            <td class="actions">
                                <a href="admin-car-edit.html?id=${car.id}" class="btn btn-warning" style="padding: 5px 15px;">✏️ Редактировать</a>
                                <button onclick="deleteCar(${car.id})" class="btn btn-danger" style="padding: 5px 15px;">🗑️ Удалить</button>
                            </td>
                        </tr>
                    `;
                });
                html += '</tbody></table>';
                carsDiv.innerHTML = html;
            } catch (error) {
                console.error('Ошибка:', error);
                carsDiv.innerHTML = '<div class="empty">Ошибка загрузки данных</div>';
            }
        }

        async function deleteCar(id) {
            if (confirm('Вы уверены, что хотите удалить этот автомобиль?')) {
                const response = await fetch(`/api/cars/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    alert('✅ Автомобиль удалён!');
                    loadCars();
                } else {
                    const error = await response.json();
                    alert('❌ Ошибка: ' + (error.error || 'Не удалось удалить'));
                }
            }
        }

        function applyFilters() {
            currentFilters = {
                search: document.getElementById('searchInput').value,
                minPrice: document.getElementById('minPrice').value,
                maxPrice: document.getElementById('maxPrice').value,
                brand: document.getElementById('brandFilter').value,
                engine: document.getElementById('engineFilter').value
            };
            loadCars();
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('minPrice').value = '';
            document.getElementById('maxPrice').value = '';
            document.getElementById('brandFilter').value = 'all';
            document.getElementById('engineFilter').value = 'all';
            currentFilters = { search: '', minPrice: '', maxPrice: '', brand: 'all', engine: 'all' };
            loadCars();
        }

        // Экспорт всех автомобилей
        function exportAllToExcel() {
            window.location.href = '/api/cars/export/excel';
        }

        // Экспорт отфильтрованных автомобилей
        function exportFilteredToExcel() {
            let url = '/api/cars/export/excel/filtered?';
            const params = [];
            if (currentFilters.search) params.push(`search=${encodeURIComponent(currentFilters.search)}`);
            if (currentFilters.minPrice) params.push(`minPrice=${currentFilters.minPrice}`);
            if (currentFilters.maxPrice) params.push(`maxPrice=${currentFilters.maxPrice}`);
            if (currentFilters.brand && currentFilters.brand !== 'all') params.push(`brand=${encodeURIComponent(currentFilters.brand)}`);
            if (currentFilters.engine && currentFilters.engine !== 'all') params.push(`engine_type=${encodeURIComponent(currentFilters.engine)}`);
            url += params.join('&');
            window.location.href = url;
        }

        async function logout() {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/';
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            loadBrands();
            loadCars();
            
            document.getElementById('applyFilterBtn')?.addEventListener('click', applyFilters);
            document.getElementById('resetFilterBtn')?.addEventListener('click', resetFilters);
            document.getElementById('exportAllBtn')?.addEventListener('click', exportAllToExcel);
            document.getElementById('exportFilteredBtn')?.addEventListener('click', exportFilteredToExcel);
            document.getElementById('logoutBtn')?.addEventListener('click', logout);
        });
    </script>
</body>
</html>
